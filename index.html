<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생기부 컨설팅 프로그램 (실시간)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif; background-color: #DCE7F2; min-height: 100vh; padding: 24px; color: #2c3e50; }

  .lock-screen { position: fixed; inset: 0; background: #DCE7F2; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-box { background: white; border-radius: 18px; padding: 40px 36px; box-shadow: 0 12px 40px rgba(70,100,140,0.18); width: 100%; max-width: 400px; text-align: center; }
  .lock-box .lock-icon { font-size: 40px; margin-bottom: 14px; }
  .lock-box h2 { font-size: 19px; color: #34495e; margin-bottom: 8px; }
  .lock-box p { font-size: 13px; color: #6c7a89; margin-bottom: 22px; line-height: 1.5; }
  .lock-box input { width: 100%; padding: 12px 14px; border: 1px solid #d0dae6; border-radius: 10px; font-size: 15px; text-align: center; background: #f7fafd; margin-bottom: 12px; }
  .lock-box input:focus { outline: none; border-color: #5a8bbf; background: white; }
  .lock-box button.main-btn { width: 100%; padding: 12px; background: #5a8bbf; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .lock-box button.main-btn:hover { background: #4a7aae; }
  .lock-error { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .role-pick { display: flex; gap: 10px; margin-bottom: 14px; }
  .role-opt { flex: 1; padding: 16px 10px; border: 2px solid #d0dae6; background: #f7fafd; border-radius: 12px; font-size: 14px; font-weight: 700; color: #5a6b7a; cursor: pointer; transition: all 0.15s; line-height: 1.4; }
  .role-opt:hover { border-color: #9db8d6; }
  .role-opt.active { border-color: #5a8bbf; background: #eaf2fb; color: #34495e; }
  .role-opt .ro-emoji { font-size: 24px; display: block; margin-bottom: 6px; }

  .conn-status { position: fixed; bottom: 16px; right: 16px; background: white; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 10px rgba(70,100,140,0.15); z-index: 500; display: flex; align-items: center; gap: 6px; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
  .conn-dot.online { background: #4caf50; }
  .conn-dot.offline { background: #e57373; }

  header { max-width: 1600px; margin: 0 auto 16px; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); border-radius: 16px; padding: 18px 26px; box-shadow: 0 2px 12px rgba(70,100,140,0.08); }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 21px; color: #34495e; margin-bottom: 6px; font-weight: 700; }
  .subtitle { font-size: 13px; color: #6c7a89; line-height: 1.5; }
  .me-bar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .role-badge { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; color: white; white-space: nowrap; }
  .role-badge.con { background: #5a8bbf; }
  .role-badge.stu { background: #87b896; }
  .link-btn { background: none; border: none; color: #6c7a89; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 4px; }
  .link-btn:hover { color: #34495e; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: rgba(0,0,0,0.55); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .student-tabs { max-width: 1600px; margin: 0 auto 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .student-tab { padding: 9px 18px; border-radius: 12px 12px 0 0; border: none; background: rgba(255,255,255,0.55); color: #5a6b7a; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .student-tab:hover { background: rgba(255,255,255,0.85); }
  .student-tab.active { background: white; color: #34495e; box-shadow: 0 -2px 8px rgba(70,100,140,0.1); }
  .student-tab .tab-del { font-size: 12px; color: rgba(0,0,0,0.35); padding: 0 2px; border-radius: 4px; }
  .student-tab .tab-del:hover { color: #c0392b; background: rgba(0,0,0,0.06); }
  .add-student-btn { padding: 9px 16px; border-radius: 10px; border: 1.5px dashed rgba(90,139,191,0.5); background: rgba(255,255,255,0.5); color: #5a8bbf; font-size: 14px; font-weight: 600; cursor: pointer; }
  .add-student-btn:hover { background: white; border-style: solid; }

  .view-toggle { max-width: 1600px; margin: 0 auto 14px; display: inline-flex; background: rgba(255,255,255,0.6); padding: 5px; border-radius: 12px; gap: 4px; }
  .seg { border: none; background: transparent; padding: 9px 20px; border-radius: 9px; font-size: 14px; font-weight: 700; color: #6c7a89; cursor: pointer; transition: all 0.15s; }
  .seg:hover { color: #34495e; }
  .seg.active { background: white; color: #34495e; box-shadow: 0 2px 8px rgba(70,100,140,0.12); }

  .toolbar { max-width: 1600px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { padding: 10px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: white; color: #34495e; box-shadow: 0 2px 6px rgba(70,100,140,0.1); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(70,100,140,0.15); }
  .btn-primary { background: #5a8bbf; color: white; }
  .btn-primary:hover { background: #4a7aae; }
  .filter-section { margin-left: auto; display: flex; gap: 8px; align-items: center; background: white; padding: 6px 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(70,100,140,0.1); }
  .filter-section label { font-size: 13px; color: #6c7a89; font-weight: 600; }
  .filter-section select { border: none; background: transparent; font-size: 14px; color: #34495e; cursor: pointer; padding: 4px 8px; font-weight: 600; }

  /* 생기부 본문 편집기 */
  #docView { max-width: 1600px; margin: 0 auto; }
  .doc-intro { font-size: 13px; color: #5a6b7a; background: rgba(255,255,255,0.55); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; line-height: 1.5; }
  .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; align-items: start; }
  .doc-card { border-radius: 14px; padding: 16px; box-shadow: 0 4px 14px rgba(70,100,140,0.12); }
  .doc-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .doc-badge { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 10px; color: rgba(0,0,0,0.72); }
  .editor-tag { font-size: 11px; color: rgba(0,0,0,0.42); margin-left: auto; }
  .doc-ta { width: 100%; border: 1px solid rgba(0,0,0,0.12); border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: inherit; line-height: 1.7; resize: vertical; min-height: 150px; background: rgba(255,255,255,0.92); }
  .doc-ta:focus { outline: none; border-color: rgba(90,139,191,0.7); background: white; box-shadow: 0 0 0 3px rgba(90,139,191,0.12); }
  .doc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; flex-wrap: wrap; }
  .doc-count { font-size: 12px; font-weight: 700; color: #5a6b7a; }
  .doc-count.over { color: #c0392b; }
  .doc-foot-right { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6c7a89; }
  .limit-input { width: 64px; border: 1px solid rgba(0,0,0,0.15); background: white; padding: 4px 6px; border-radius: 6px; font-size: 12px; font-family: inherit; text-align: center; }
  .copy-btn { background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: rgba(0,0,0,0.65); }
  .copy-btn:hover { background: white; border-color: rgba(0,0,0,0.3); }

  .board { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; align-items: start; }
  .memo-group { background: rgba(255,255,255,0.32); border-radius: 16px; padding: 14px; border: 1px solid rgba(255,255,255,0.6); }

  .memo { border-radius: 12px; padding: 18px; box-shadow: 0 6px 18px rgba(70,100,140,0.18); word-break: break-word; min-height: 150px; margin-bottom: 12px; }
  .memo-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .memo-meta { font-size: 12px; color: rgba(0,0,0,0.55); }
  .memo-author { font-weight: 700; color: rgba(0,0,0,0.78); }
  .memo-time { color: rgba(0,0,0,0.45); }
  .cat-badge { display: inline-block; background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.78); padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
  .memo-content { font-size: 14px; line-height: 1.6; color: rgba(0,0,0,0.85); white-space: pre-wrap; }
  .memo-image, .comment-image { margin-top: 10px; }
  .memo-image img, .comment-image img { max-width: 100%; border-radius: 8px; cursor: pointer; display: block; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }

  .comment { border-radius: 12px; padding: 12px 14px; box-shadow: 0 4px 12px rgba(70,100,140,0.13); word-break: break-word; margin-bottom: 10px; font-size: 13px; }
  .comment.reply { margin-left: 16px; position: relative; }
  .comment.reply::before { content: ''; position: absolute; left: -16px; top: -10px; width: 12px; height: 22px; border-left: 2px dashed rgba(90,139,191,0.4); border-bottom: 2px dashed rgba(90,139,191,0.4); border-bottom-left-radius: 8px; }
  .comment-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
  .comment-meta { font-size: 11px; color: rgba(0,0,0,0.55); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .comment-author { font-weight: 700; color: rgba(0,0,0,0.78); }
  .comment-time { color: rgba(0,0,0,0.45); }
  .tag-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; color: white; white-space: nowrap; }
  .tag-question { background: #c4a47d; }
  .tag-interpret { background: #9b87b8; }
  .tag-suggest { background: #7d9fc4; }
  .tag-concern { background: #c47d8a; }
  .tag-agree { background: #87b896; }
  .tag-etc { background: #9aa7b4; }
  .comment-content { color: rgba(0,0,0,0.85); white-space: pre-wrap; line-height: 1.55; }
  .actions { display: flex; gap: 2px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: rgba(0,0,0,0.4); padding: 2px 5px; line-height: 1; border-radius: 4px; }
  .icon-btn:hover { color: rgba(0,0,0,0.85); background: rgba(0,0,0,0.08); }

  .reply-btn { background: rgba(90,139,191,0.12); border: 1px solid rgba(90,139,191,0.4); cursor: pointer; font-size: 11px; color: #4a7aae; padding: 5px 12px; font-weight: 700; border-radius: 8px; transition: all 0.15s; margin-top: 6px; }
  .reply-btn:hover { background: #5a8bbf; color: white; border-color: #5a8bbf; }
  .add-comment-btn { width: 100%; background: rgba(255,255,255,0.55); border: 1.5px dashed rgba(90,139,191,0.5); border-radius: 10px; padding: 10px; cursor: pointer; color: #5a8bbf; font-size: 13px; font-weight: 600; transition: all 0.15s; }
  .add-comment-btn:hover { background: rgba(255,255,255,0.85); border-color: #5a8bbf; border-style: solid; }

  .comment-form { background: rgba(255,255,255,0.7); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(70,100,140,0.15); border: 2px solid rgba(90,139,191,0.4); }
  .comment-form.reply-form { margin-left: 16px; }
  .form-row-top { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .author-input { flex: 1; min-width: 100px; border: 1px solid rgba(0,0,0,0.15); background: white; padding: 5px 8px; border-radius: 6px; font-size: 12px; font-family: inherit; }
  .tag-selector { display: flex; gap: 3px; flex-wrap: wrap; }
  .tag-btn { border: 1.5px solid transparent; background: rgba(255,255,255,0.85); padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; cursor: pointer; color: rgba(0,0,0,0.6); transition: all 0.15s; }
  .tag-btn:hover { border-color: rgba(0,0,0,0.3); }
  .tag-btn.active { color: white; }
  .tag-btn.active[data-tag="question"] { background: #c4a47d; border-color: #c4a47d; }
  .tag-btn.active[data-tag="interpret"] { background: #9b87b8; border-color: #9b87b8; }
  .tag-btn.active[data-tag="suggest"] { background: #7d9fc4; border-color: #7d9fc4; }
  .tag-btn.active[data-tag="etc"] { background: #9aa7b4; border-color: #9aa7b4; }
  .comment-form textarea { width: 100%; border: 1px solid rgba(0,0,0,0.15); background: white; padding: 8px 10px; border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 60px; line-height: 1.55; }
  .comment-form textarea:focus, .comment-form input:focus { outline: none; border-color: rgba(90,139,191,0.6); }
  .img-attach-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .img-attach-btn { background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: rgba(0,0,0,0.65); }
  .img-attach-btn:hover { background: white; border-color: rgba(0,0,0,0.3); }
  .img-preview-wrap { position: relative; display: inline-block; }
  .img-preview-wrap img { max-height: 60px; border-radius: 6px; display: block; }
  .img-remove-btn { position: absolute; top: -7px; right: -7px; background: #c0392b; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; line-height: 1; }
  .form-row-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .form-hint { font-size: 10px; color: rgba(0,0,0,0.5); }
  .form-buttons { display: flex; gap: 4px; }
  .submit-btn { background: #5a8bbf; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .submit-btn:hover { background: #4a7aae; }
  .cancel-btn { background: transparent; color: rgba(0,0,0,0.55); border: none; padding: 6px 10px; cursor: pointer; font-size: 11px; font-weight: 600; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(40,60,90,0.4); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal { background: white; border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin-bottom: 18px; color: #34495e; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: #6c7a89; margin-bottom: 6px; font-weight: 600; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #d0dae6; border-radius: 8px; font-size: 14px; font-family: inherit; background: #f7fafd; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #5a8bbf; background: white; }
  .form-group textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

  .img-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 30px; cursor: zoom-out; }
  .img-lightbox.active { display: flex; }
  .img-lightbox img { max-width: 95%; max-height: 95%; border-radius: 8px; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #6c7a89; background: rgba(255,255,255,0.5); border-radius: 16px; border: 2px dashed rgba(90,139,191,0.3); }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #5a8bbf; }

  .area-tabs { max-width: 1600px; margin: 0 auto 16px; display: flex; gap: 6px; flex-wrap: wrap; }
  .area-tab { padding: 7px 14px; border: none; border-radius: 10px; background: rgba(255,255,255,0.5); color: #5a6b7a; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .area-tab:hover { background: rgba(255,255,255,0.85); }
  .area-tab.active { background: white; color: #34495e; box-shadow: 0 2px 8px rgba(70,100,140,0.12); }
  .area-tab .area-dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }

  .main-split { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .pane { background: rgba(255,255,255,0.32); border-radius: 16px; padding: 14px; border: 1px solid rgba(255,255,255,0.6); min-width: 0; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; color: #34495e; margin-bottom: 12px; flex-wrap: wrap; }
  .pane-head-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn-sm { padding: 7px 12px; font-size: 13px; }
  .pane-right .board { max-width: none; margin: 0; grid-template-columns: 1fr; }
  .pdf-viewer { display: block; }
  .pdf-frame { width: 100%; height: 82vh; border: 1px solid rgba(0,0,0,0.12); border-radius: 8px; background: #fff; }
  .pdf-viewer.pdf-scroll { max-height: 82vh; overflow-y: auto; padding-right: 4px; scroll-behavior: smooth; }
  .pdf-page { width: 100%; display: block; margin-bottom: 10px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); background: #fff; }
  /* 영역 캡처 (스샷&드래그) */
  .pdf-viewer.capture-mode, .pdf-viewer.capture-mode .pdf-page { cursor: crosshair; }
  .cap-selbox { position: fixed; z-index: 9999; border: 2px solid #2d72d2; background: rgba(80,150,255,0.18); pointer-events: none; display: none; border-radius: 2px; }
  /* 작성창 캡처/사진 + 형광펜 편집 */
  .cap-edit { margin-top: 8px; border: 1px solid rgba(90,139,191,0.4); border-radius: 10px; padding: 8px; background: rgba(255,255,255,0.85); }
  .cap-edit-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .cap-tool { border: 1px solid rgba(0,0,0,0.15); background: #fff; border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 600; cursor: pointer; color: #34495e; }
  .cap-tool:hover { background: #f3f7fb; }
  .cap-tool.active { background: #fff7c2; border-color: #e6c200; }
  .cap-tool.danger { color: #c0392b; }
  .cap-hint { font-size: 11px; color: #8aa0b6; }
  .cap-edit-stage { max-height: 300px; overflow: auto; border-radius: 8px; background: #f4f7fb; padding: 6px; text-align: center; }
  .cap-edit-wrap { position: relative; display: inline-block; }
  .cap-edit-img { display: block; max-width: 100%; height: auto; border-radius: 6px; }
  .cap-edit-overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .cap-edit-stage.hl .cap-edit-overlay { pointer-events: auto; cursor: crosshair; }
  .section-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .section-bar:empty { display: none; }
  .sec-hint { font-size: 12px; font-weight: 700; color: #5a6b7a; margin-right: 2px; }
  .sec-item { display: inline-flex; align-items: center; }
  .sec-btn { border: none; background: #eaf2fb; color: #34495e; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .sec-item .sec-btn { border-radius: 8px 0 0 8px; }
  .sec-btn:hover { background: #d8e8f8; }
  .sec-set { border: none; background: #dbe6f3; color: #4a6a8a; font-size: 11px; font-weight: 700; padding: 6px 8px; border-radius: 0 8px 8px 0; cursor: pointer; border-left: 1px solid rgba(255,255,255,0.7); }
  .sec-set:hover { background: #c9dcf0; }
  .sec-top { background: #efe9dd; color: #6b5e44; }
  .sec-top:hover { background: #e6ddca; }
  .composer { background: rgba(255,255,255,0.72); border: 1.5px solid rgba(90,139,191,0.4); border-radius: 12px; padding: 12px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(70,100,140,0.1); }

<script>
  /* ===== Firebase 실시간 연결 버전 ===== */
  /* 학생·의견이 Firebase 실시간 DB로 여러 기기에서 공유됩니다. (PDF 원본은 각 기기에서 불러오기) */

  /* 오류가 나면 화면 상단에 빨간 띠로 알려줍니다 (원격 진단용) */
  window.addEventListener('error', function(e){
    try {
      const m=(e&&e.message)||(e&&e.error&&e.error.message)||'';
      if(/importScripts|Worker|pdf\.worker|blob:null/i.test(m)) return;   // pdf.js worker 실패는 iframe 폴백으로 처리 → 배너 숨김
      let b=document.getElementById('__errbar');
      if(!b){ b=document.createElement('div'); b.id='__errbar'; b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#c0392b;color:#fff;padding:10px 14px;font:13px/1.5 monospace;white-space:pre-wrap;'; (document.body||document.documentElement).appendChild(b); }
      b.textContent='⚠ 스크립트 오류: '+(e.message||(e.error&&e.error.message)||'알 수 없음')+' ('+(e.lineno||'?')+'행) — 이 메시지를 캡처해 알려주세요.';
    } catch(_){}
  });

  const CATEGORY_COLORS = { '자율활동':'#FFD6D6','진로활동':'#C8E6F0','동아리활동':'#D4F0D4','봉사활동':'#FFDAB8','교과세특':'#FFF4B8','독서활동':'#E0D4F0','행동특성':'#F5E1C8','기타':'#FFFFFF' };
  function categoryColor(cat) { return CATEGORY_COLORS[cat] || '#FFFFFF'; }
  function lightenColor(hex, ratio) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const lr = Math.round(r + (255-r)*ratio), lg = Math.round(g + (255-g)*ratio), lb = Math.round(b + (255-b)*ratio);
    return `rgb(${lr}, ${lg}, ${lb})`;
  }
  const TAGS = { question:{label:'🔍 질문',class:'tag-question'}, interpret:{label:'💬 해석',class:'tag-interpret'}, suggest:{label:'💡 보완',class:'tag-suggest'}, etc:{label:'⭐ 기타',class:'tag-etc'} };
  const LEGACY_TAGS = { concern:{label:'⚠️ 우려',class:'tag-concern'}, agree:{label:'✅ 동의',class:'tag-agree'} };
  function getTag(k){ return TAGS[k] || LEGACY_TAGS[k] || TAGS.question; }

  const AREAS = ['자율활동','진로활동','동아리활동','봉사활동','교과세특','행동특성','기타'];
  const AREA_LABELS = { '자율활동':'자율·자치활동','진로활동':'진로활동','동아리활동':'동아리활동','봉사활동':'봉사활동','교과세특':'교과 세부능력 및 특기사항','행동특성':'행동특성 및 종합의견','기타':'기타' };
  function areaLabel(a){ return AREA_LABELS[a] || a; }

  let students = {};   // Firebase 실시간 DB에서 onValue로 채워집니다

  let currentStudentId = null;
  let currentArea = 'all';   // 'all' 또는 영역명
  function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
  function ssSet(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
  let role = ssGet('board_role') || null;
  let myName = ssGet('board_name') || '';

  let editingMemoId = null;
  let modalImageData = null;
  let activeReplyTo = null;
  let activeEditComment = null;
  let formState = {};
  let docBuiltKey = null;
  let docSaveTimers = {};

  function isConsultant(){ return role === 'consultant'; }
  function roleLabel(){ return role === 'consultant' ? '교사' : '학생'; }
  function canEdit(author){ return !!myName && (author||'').trim() === myName.trim(); }   // 본인이 쓴 의견만 수정
  const DELETE_PASSWORD = "1234";   // 의견 삭제 시 입력하는 비밀번호 (원하는 값으로 변경하세요)
  function passDeleteGate(msg){
    const pw = prompt((msg?msg+'\n\n':'') + '삭제하려면 비밀번호를 입력하세요.');
    if(pw===null) return false;
    if(pw !== DELETE_PASSWORD){ alert('비밀번호가 올바르지 않습니다.'); return false; }
    return true;
  }

  /* ---------- Firebase 실시간 DB 연결 ---------- */
  const firebaseConfig = {
    apiKey: "AIzaSyD5B3al02OaE2kRiE3JHNuKPMIcNpbslMo",
    authDomain: "cunsulting-2a4ac.firebaseapp.com",
    databaseURL: "https://cunsulting-2a4ac-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cunsulting-2a4ac",
    storageBucket: "cunsulting-2a4ac.firebasestorage.app",
    messagingSenderId: "707815169727",
    appId: "1:707815169727:web:576550281f64950905f00a"
  };
  if (typeof firebase === 'undefined' || !firebase.initializeApp) {
    alert('Firebase 라이브러리를 불러오지 못했습니다.\n인터넷에 연결한 뒤 새로고침해 주세요.');
    throw new Error('Firebase SDK not loaded (인터넷 필요)');
  }
  firebase.initializeApp(firebaseConfig);
  const fdb = firebase.database();
  // 호출부 호환용: ref(null, 'students/...') 형태를 그대로 Firebase ref로 변환
  function ref(_db, path){ return fdb.ref(path); }
  function set(r, value){ return r.set(value); }
  function update(r, partial){ return r.update(partial); }
  function remove(r){ return r.remove(); }
  function push(r){ return r.push(); }
  const studentsRef = ref(null, 'students');
  // 실시간 구독: 누가 바꾸든 모든 기기에 자동 반영
  studentsRef.on('value', function(snap){ students = snap.val() || {}; afterChange(); }, function(err){ console.error(err); setConn(false); });
  fdb.ref('.info/connected').on('value', function(s){ setConn(!!s.val()); });

  function ensureCurrentStudent(){
    if(role==='student'){ if(currentStudentId && !students[currentStudentId]) currentStudentId=null; return; }  // 학생은 본인 페이지 고정
    if(!currentStudentId || !students[currentStudentId]){
      const ids = Object.keys(students);
      currentStudentId = ids.length ? ids.sort((a,b)=>students[a].createdAt-students[b].createdAt)[0] : null;
      docBuiltKey = null;
    }
  }
  function renderMain(){ renderPdfViewer(); renderSectionBar(); renderBoard(); }
  function afterChange(){
    ensureCurrentStudent();
    renderTabs();
    renderAreaTabs();
    renderMain();
  }
  function setConn(on){ const d=document.getElementById('connDot'),t=document.getElementById('connText'); if(!d||!t) return; if(on){ d.className='conn-dot online'; t.textContent='실시간 연결됨'; } else { d.className='conn-dot offline'; t.textContent='연결 끊김 (인터넷 확인)'; } }

  function importData(ev){
    const file = ev.target.files[0]; if(!file){ return; }
    const reader = new FileReader();
    reader.onload = e=>{
      try {
        const data = JSON.parse(e.target.result);
        if(typeof data!=='object' || data===null || Array.isArray(data)) throw new Error('형식이 올바르지 않습니다.');
        if(!confirm('가져오기를 하면 Firebase에 합쳐집니다(실시간 공유).\n같은 학생은 덮어쓸 수 있어요. 계속할까요?')){ ev.target.value=''; return; }
        Object.keys(data).forEach(id=>{ fdb.ref('students/'+id).set(data[id]); });
        toast('가져오기 완료 (실시간 반영)');
      } catch(err){ alert('가져오기 실패: '+err.message); }
      ev.target.value='';
    };
    reader.readAsText(file);
  }

  /* ---------- 생기부 원본 PDF 뷰어 (왼쪽 패널, 브라우저 내장 뷰어) ---------- */
  /* pdf.js로 페이지를 이미지로 렌더 → 항목 클릭 시 해당 쪽으로 스크롤. 렌더 실패 시 기본 PDF 뷰어(iframe)로 폴백. */
  let pdfByStudent = {};        // studentId -> blob URL (폴백 iframe용)
  let pdfPagesByStudent = {};   // studentId -> [페이지 이미지 dataURL] (스크롤 이동용)
  let pdfRenderedFor = null;
  let pdfjsLoading = null;
  const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174';
  function loadPdfJs(){
    if(window.pdfjsLib && window.__pdfWorkerReady) return Promise.resolve(window.pdfjsLib);
    if(pdfjsLoading) return pdfjsLoading;
    pdfjsLoading = new Promise((resolve, reject)=>{
      const s=document.createElement('script'); s.src=PDFJS_BASE+'/pdf.min.js';
      s.onload=async ()=>{ try{ const code=await (await fetch(PDFJS_BASE+'/pdf.worker.min.js')).text(); pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'application/javascript'})); window.__pdfWorkerReady=true; resolve(window.pdfjsLib); }catch(e){ reject(e); } };
      s.onerror=()=>reject(new Error('pdf.js 로드 실패'));
      document.head.appendChild(s);
    });
    return pdfjsLoading;
  }
  async function renderPdfPages(file){
    const lib=await loadPdfJs();
    const buf=await file.arrayBuffer();
    const pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise;
    const pages=[];
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const vp=page.getViewport({scale:1.4});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
      pages.push(c.toDataURL('image/jpeg',0.8));
    }
    return pages;
  }
  function emptyPdfHtml(h, p){
    return `<div class="empty-state"><h3>${h}</h3>${p?`<p>${p}<br><span style="font-size:12px;color:#9aa7b4;">원본 PDF는 용량 때문에 저장되지 않습니다. 창을 다시 열면 다시 불러와 주세요.</span></p>`:''}</div>`;
  }
  function renderPdfViewer(){
    const v = document.getElementById('pdfViewer'); if(!v) return;
    if(!currentStudentId){ v.innerHTML = emptyPdfHtml('학생을 선택해 주세요', ''); v.classList.remove('pdf-scroll'); pdfRenderedFor='__none__'; return; }
    const url = pdfByStudent[currentStudentId] || '';
    const pages = pdfPagesByStudent[currentStudentId] || null;
    const key = currentStudentId + '|' + (pages ? 'img'+pages.length : (url ? 'frame' : '0'));
    if(pdfRenderedFor === key) return;            // 같은 상태면 다시 그리지 않음
    pdfRenderedFor = key;
    if(pages && pages.length){
      v.classList.add('pdf-scroll');
      v.innerHTML = pages.map((src,i)=>`<img class="pdf-page" id="pdfpage-${i+1}" src="${src}" alt="생기부 ${i+1}쪽" draggable="false">`).join('');
    } else if(url){
      v.classList.remove('pdf-scroll');
      v.innerHTML = `<iframe class="pdf-frame" src="${url}" title="생기부 원본"></iframe>`;
    } else {
      v.classList.remove('pdf-scroll');
      v.innerHTML = emptyPdfHtml('생기부 PDF가 없습니다', '위 "📄 PDF 불러오기"로 이 학생의 생기부 PDF를 불러오면 원본이 여기에 표시됩니다.');
    }
  }
  /* ---------- 생기부 항목 이동 (창체/교과/행특, 시작 쪽으로 점프) ---------- */
  const SECTIONS = [
    { key:'chang', label:'창의적 체험활동상황' },
    { key:'gyo',   label:'교과학습발달상황' },
    { key:'haeng', label:'행동특성 및 종합의견' }
  ];
  function renderSectionBar(){
    const bar = document.getElementById('sectionBar'); if(!bar) return;
    if(!currentStudentId){ bar.innerHTML=''; return; }
    const sp = (students[currentStudentId] && students[currentStudentId].secPages) || {};
    bar.innerHTML = `<span class="sec-hint">📑 항목 이동:</span>` + SECTIONS.map(s=>{
      const pg = sp[s.key];
      return `<span class="sec-item"><button class="sec-btn" onclick="jumpToSection('${s.key}')" title="이 항목으로 이동">${s.label}${pg?` ${pg}쪽`:''}</button><button class="sec-set" onclick="setSectionPage('${s.key}')" title="시작 쪽 설정/변경">${pg?'✎':'쪽 설정'}</button></span>`;
    }).join('') + `<button class="sec-btn sec-top" onclick="jumpToSection('__top__')" title="첫 쪽으로">↥ 처음</button>`;
  }
  window.setSectionPage = function(secKey){
    if(!currentStudentId) return null;
    const s = SECTIONS.find(x=>x.key===secKey); if(!s) return null;
    const cur = ((students[currentStudentId]||{}).secPages||{})[secKey] || '';
    const inp = prompt(`'${s.label}' 항목은 PDF의 몇 쪽부터인가요? (숫자만 입력)`, cur||'');
    if(inp===null) return null;
    const page = parseInt(inp,10);
    if(!page || page<1){ alert('쪽 번호(숫자)를 입력해 주세요.'); return null; }
    update(ref(null,`students/${currentStudentId}/secPages`), { [secKey]: page });
    return page;
  };
  window.jumpToSection = function(secKey){
    if(!currentStudentId) return;
    const pages = pdfPagesByStudent[currentStudentId];
    const url = pdfByStudent[currentStudentId];
    if(!pages && !url){ alert('먼저 "📄 PDF 불러오기"로 생기부 원본을 불러와 주세요.'); return; }
    let page;
    if(secKey==='__top__'){ page = 1; }
    else {
      page = ((students[currentStudentId]||{}).secPages||{})[secKey];
      if(!page){ page = setSectionPage(secKey); if(!page) return; }
    }
    if(pages && pages.length){
      const target = document.getElementById('pdfpage-' + Math.min(Math.max(1,page), pages.length));
      if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
    } else {
      const iframe = document.querySelector('#pdfViewer iframe.pdf-frame');
      if(iframe){ iframe.src = url.split('#')[0] + '#page=' + page; }   // 폴백(브라우저에 따라 무시될 수 있음)
    }
  };
  window.handlePdf = async function(ev){
    const file = ev.target.files[0]; ev.target.value=''; if(!file) return;
    if(!currentStudentId){ alert('먼저 학생을 추가/선택해 주세요.'); return; }
    if(file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name||'')){ alert('PDF 파일을 선택해 주세요.'); return; }
    const sid = currentStudentId;
    try { if(pdfByStudent[sid]){ URL.revokeObjectURL(pdfByStudent[sid]); } } catch(e){}
    pdfByStudent[sid] = URL.createObjectURL(file);
    pdfPagesByStudent[sid] = null;
    pdfRenderedFor = null;
    renderPdfViewer();      // 우선 기본 뷰어(iframe)로 즉시 표시
    renderSectionBar();
    if(location.protocol === 'file:'){ toast('PDF를 불러왔어요. (항목 자동 스크롤은 웹에 올리면 작동)'); return; }   // file://에선 pdf.js worker 불가 → iframe만
    toast('생기부 PDF를 불러왔어요. 항목 이동 준비 중…');
    // pdf.js로 페이지 이미지 렌더(항목 이동=스크롤용). 실패/지연 시 iframe 폴백 유지.
    try {
      const pages = await Promise.race([ renderPdfPages(file), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 20000)) ]);
      if(pages && pages.length && currentStudentId===sid){
        pdfPagesByStudent[sid] = pages;
        pdfRenderedFor = null; renderPdfViewer();
        toast(`항목 이동 준비 완료 (${pages.length}쪽). 항목 버튼으로 바로 이동돼요.`);
      }
    } catch(e){ /* iframe 폴백 유지 — 표시는 되지만 항목 이동은 제한될 수 있음 */ }
  };
  document.getElementById('pdfBtn').addEventListener('click', ()=> document.getElementById('pdfFile').click());
  document.getElementById('pdfFile').addEventListener('change', handlePdf);

  /* ---------- 영역 캡처 (스샷&드래그 → 작성창 첨부) ---------- */
  let capMode=false, capStart=null, capImgEl=null;
  function getSelBox(){ let b=document.getElementById('capSelBox'); if(!b){ b=document.createElement('div'); b.id='capSelBox'; b.className='cap-selbox'; document.body.appendChild(b); } return b; }
  function hideSelBox(){ const b=document.getElementById('capSelBox'); if(b) b.style.display='none'; }
  function setCaptureMode(on){
    if(on){
      if(!currentStudentId){ alert('먼저 학생을 선택해 주세요.'); return; }
      const pages=pdfPagesByStudent[currentStudentId];
      if(!pages || !pages.length){ alert('캡처는 생기부 PDF가 이미지로 준비된 뒤 작동해요.\n웹 링크(https)에서 PDF를 불러오면 잠시 후 준비됩니다. (로컬 파일 더블클릭에서는 지원되지 않아요.)'); return; }
    }
    capMode=on; capStart=null; capImgEl=null; hideSelBox();
    const v=document.getElementById('pdfViewer'); if(v) v.classList.toggle('capture-mode', on);
    const btn=document.getElementById('captureBtn'); if(btn){ btn.classList.toggle('active', on); btn.textContent = on ? '✂️ 캡처 취소' : '✂️ 영역 캡처'; }
    if(on) toast('생기부에서 캡처할 영역을 드래그하세요');
  }
  function clampToImg(x,y){ const r=capImgEl.getBoundingClientRect(); return { x:Math.min(Math.max(x,r.left),r.right), y:Math.min(Math.max(y,r.top),r.bottom) }; }
  function updateSelBox(curX,curY){
    if(!capStart||!capImgEl) return;
    const c=clampToImg(curX,curY);
    const x1=Math.min(capStart.x,c.x), y1=Math.min(capStart.y,c.y), x2=Math.max(capStart.x,c.x), y2=Math.max(capStart.y,c.y);
    const b=getSelBox(); b.style.display='block'; b.style.left=x1+'px'; b.style.top=y1+'px'; b.style.width=(x2-x1)+'px'; b.style.height=(y2-y1)+'px';
  }
  document.getElementById('captureBtn').addEventListener('click', ()=> setCaptureMode(!capMode));
  document.getElementById('pdfViewer').addEventListener('mousedown', function(e){
    if(!capMode) return;
    const img=e.target.closest && e.target.closest('.pdf-page'); if(!img) return;
    e.preventDefault();

    if(!capMode || !capStart || !capImgEl) return;

    const r=capImgEl.getBoundingClientRect();
    const left=Math.min(startC.x,endC.x), top=Math.min(startC.y,endC.y), w=Math.abs(endC.x-startC.x), h=Math.abs(endC.y-startC.y);

  /* ---------- 사진 압축 ---------- */
  function compressImage(file, maxSize, quality){
    return new Promise((resolve,reject)=>{
      if(!file.type.startsWith('image/')){ reject(new Error('이미지 파일이 아닙니다.')); return; }
      const reader=new FileReader();
      reader.onload=e=>{ const img=new Image();
        img.onload=()=>{ let{width,height}=img;
          if(width>height&&width>maxSize){height=Math.round(height*maxSize/width);width=maxSize;}
          else if(height>maxSize){width=Math.round(width*maxSize/height);height=maxSize;}
          const c=document.createElement('canvas');c.width=width;c.height=height;c.getContext('2d').drawImage(img,0,0,width,height);
          let r=c.toDataURL('image/jpeg',quality),q=quality;
          while(r.length>700000&&q>0.3){q-=0.15;r=c.toDataURL('image/jpeg',q);}
          resolve(r);
        };
        img.onerror=()=>reject(new Error('이미지를 불러올 수 없습니다.')); img.src=e.target.result;
      };
      reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.')); reader.readAsDataURL(file);
    });
  }
  // 캔버스를 용량 제한(≤~700KB) JPEG dataURL로 변환 (compressImage와 동일 기준)
  function canvasToData(cv){ let q=0.85, r=cv.toDataURL('image/jpeg',q); while(r.length>700000 && q>0.3){ q-=0.15; r=cv.toDataURL('image/jpeg',q); } return r; }
  // 형광펜 경로를 이미지에 합성(굽기) → 하나의 dataURL
  function bakeHighlights(src, paths){
    return new Promise((resolve)=>{
      if(!paths || !paths.length){ resolve(src); return; }
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
        const x=c.getContext('2d'); x.drawImage(img,0,0);
        paths.forEach(p=>{ if(!p.points||!p.points.length)return; x.lineCap='round'; x.lineJoin='round'; x.lineWidth=p.width; x.strokeStyle=p.color; x.beginPath(); x.moveTo(p.points[0].x,p.points[0].y); for(let i=1;i<p.points.length;i++)x.lineTo(p.points[i].x,p.points[i].y); x.stroke(); });
        resolve(canvasToData(c));
      };
      img.onerror=()=>resolve(src); img.src=src;
    });
  }

  function mountComposerOverlay(){

  function drawComposerHL(){
    const overlay=document.getElementById('capOverlay'); if(!overlay) return;
    const c=overlay.getContext('2d'); c.clearRect(0,0,overlay.width,overlay.height);
    composerHighlights.forEach(p=>{ if(!p.points.length)return; c.lineCap='round'; c.lineJoin='round'; c.lineWidth=p.width; c.strokeStyle=p.color; c.beginPath(); c.moveTo(p.points[0].x,p.points[0].y); for(let i=1;i<p.points.length;i++)c.lineTo(p.points[i].x,p.points[i].y); c.stroke(); });
  }
  function bindComposerOverlay(){
    const overlay=document.getElementById('capOverlay'); if(!overlay || overlay.dataset.bound==='1') return;

    overlay.addEventListener('mousedown', ev=>{ if(!composerHLMode)return; drawing=true; const p=pt(ev); active={ points:[p], color:'rgba(255,235,59,0.45)', width:Math.max(14,Math.round(overlay.height*0.03)) }; composerHighlights.push(active); drawComposerHL(); ev.preventDefault(); ev.stopPropagation(); });
    overlay.addEventListener('mousemove', ev=>{ if(!drawing||!active||!composerHLMode)return; active.points.push(pt(ev)); drawComposerHL(); });

  async function submitComposer(){
    if(!currentStudentId){ alert('먼저 학생을 추가/선택해 주세요.'); return; }
    const text=document.getElementById('composerText').value.trim();
    const area=document.getElementById('composerArea').value;
    if(!text && !composerImageData){ alert('의견 내용을 입력하거나 사진을 첨부해 주세요.'); return; }
    const tag = composerTag || 'etc';   // 유형 미선택 시 '기타'로
    let subject = '';
    if(area==='교과세특'){

    const r=push(ref(null,`students/${currentStudentId}/memos`));

    document.getElementById('composerText').value=''; composerImageData=null; composerHighlights=[]; composerHLMode=false; renderComposerImg();
    composerTag=null; document.querySelectorAll('#composerTags .tag-btn').forEach(x=>x.classList.remove('active'));
    document.getElementById('composerSubject').value=''; document.getElementById('composerSubjectCustom').value=''; updateComposerSubjectVis();
    toast('의견을 등록했어요');
  }

  window.updateModalColorHint = function(){
    const cat=document.getElementById('inputCategory').value, color=categoryColor(cat);
    document.getElementById('modalColorSwatch').style.background=color;
    document.getElementById('modalColorText').textContent=`${cat} 영역 색상`;
  };
  document.getElementById('inputCategory').addEventListener('change', window.updateModalColorHint);
  window.handleMemoImage = async function(event){
    const file=event.target.files[0]; if(!file)return;
    try{ modalImageData=await compressImage(file,1000,0.7); renderMemoImagePreview(); }
    catch(err){ alert('사진 처리 실패: '+err.message); }
    event.target.value='';
  };
  function renderMemoImagePreview(){
    const w=document.getElementById('inputImagePreview');
    w.innerHTML = modalImageData ? `<div class="img-preview-wrap"><img src="${modalImageData}"><button type="button" class="img-remove-btn" onclick="removeMemoImage()">✕</button></div>` : '';
  }
  window.removeMemoImage = function(){ modalImageData=null; renderMemoImagePreview(); };
  window.editMemo = function(memoId){
    const memo=currentMemos()[memoId]; if(!memo)return;
    if(!canEdit(memo.author)){ alert('본인이 작성한 의견만 수정할 수 있습니다.'); return; }
    editingMemoId=memoId; modalImageData=memo.image||null;
    document.getElementById('modalTitle').textContent='의견 메모 수정';
    document.getElementById('submitMemoBtn').textContent='수정 완료';
    document.getElementById('inputAuthor').value=memo.author||'';
    document.getElementById('inputCategory').value=memo.category||'자율활동';
    document.getElementById('inputContent').value=memo.content||'';
    renderMemoImagePreview(); updateModalColorHint();
    document.getElementById('modal').classList.add('active');
  };
  window.closeModal = function(){ document.getElementById('modal').classList.remove('active'); editingMemoId=null; modalImageData=null; };
  window.submitMemo = function(){
    const author=document.getElementById('inputAuthor').value.trim();
    const category=document.getElementById('inputCategory').value;
    const content=document.getElementById('inputContent').value.trim();
    if(!content&&!modalImageData){ alert('내용을 입력하거나 사진을 첨부해주세요.'); return; }
    const color=categoryColor(category);
    if(editingMemoId){
      update(ref(null,`students/${currentStudentId}/memos/${editingMemoId}`), { author, category, content, color, image:modalImageData||null, editedAt:Date.now() });
    } else {
      const r=push(ref(null,`students/${currentStudentId}/memos`));
      set(r, { author, category, content, color, image:modalImageData||null, createdAt:Date.now(), comments:{} });
    }
    closeModal();
  };
  window.deleteMemo = function(memoId){
    if(!passDeleteGate('이 의견과 달린 모든 답글이 함께 삭제됩니다.')) return;
    remove(ref(null,`students/${currentStudentId}/memos/${memoId}`));
    toast('삭제되었습니다');
  };

  setupComposer();
  document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
  document.getElementById('filterTag').addEventListener('change', renderBoard);

  /* ---------- 유틸 ---------- */
  function escapeHtml(t){ if(!t&&t!=='')return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
  function formatDate(ts){ if(!ts) return ''; const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; }
  function toast(msg){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); } t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }

  /* ---------- 초기화 ---------- */
  if (role==='student' && myName) {
    const sid=ssGet('board_student'); if(sid) currentStudentId=sid;
    document.getElementById('lockScreen').style.display='none';
    enterBoard();
  } else if (role==='consultant' && myName) {
    document.getElementById('lockScreen').style.display='none';
    enterBoard();
  } else {
    showStep('role');
  }
</script>

</body>
</html>
